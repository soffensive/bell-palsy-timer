<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background so the same artwork works as a maskable icon;
       all content stays inside the central safe zone (radius ~205). -->
  <rect width="512" height="512" fill="#2e6b5e"/>
  <!-- timer ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#c3e1d8" stroke-width="22" opacity="0.35"/>
  <path d="M256 106 A150 150 0 1 1 112 298" fill="none" stroke="#f1dda6" stroke-width="22" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="206" cy="226" r="16" fill="#ffffff"/>
  <circle cx="306" cy="226" r="16" fill="#ffffff"/>
  <path d="M188 290 Q256 345 324 290" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
</svg>
