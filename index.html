<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fazialisparese – Übungsprogramm</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        sans-serif;
      background: #e7f1ec;
      background: linear-gradient(160deg, #e7f1ec 0%, #d9eae2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 16px;
      color: #1e2b26;
    }

    .app {
      width: 100%;
      max-width: 440px;
    }

    /* top bar */
    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .lang-switch {
      display: inline-flex;
      background: #ffffff;
      border-radius: 999px;
      padding: 3px;
      box-shadow: 0 8px 20px -14px rgba(30, 43, 38, 0.4);
    }

    .lang-switch button {
      border: none;
      background: none;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: #3d534a;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .lang-switch button[aria-pressed="true"] {
      background: #2e6b5e;
      color: #ffffff;
    }

    /* cards */
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px 20px 20px;
      box-shadow: 0 20px 40px -24px rgba(30, 43, 38, 0.3);
      margin-bottom: 12px;
    }

    .screen {
      display: none;
      flex-direction: column;
    }

    .screen.is-active {
      display: flex;
    }

    h1,
    h2,
    h3 {
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 2px;
    }

    h2 {
      font-size: 1.3rem;
    }

    h3 {
      font-size: 1rem;
    }

    .meta {
      color: #3d534a;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    /* stats */
    /* trends (start page) */
    .trends {
      background: #f9fbfa;
      border: 1px solid #e6efea;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.82rem;
    }

    .trends[hidden] {
      display: none;
    }

    .trends summary {
      font-weight: 600;
      color: #1e4d42;
      cursor: pointer;
    }

    .trends h4 {
      font-size: 0.74rem;
      font-weight: 600;
      color: #7a8f86;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 10px 0 4px;
    }

    .trend-row {
      display: grid;
      grid-template-columns: 1fr 90px 4.6em;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
    }

    .trend-row .spark {
      color: #2e6b5e;
    }

    .trend-row strong {
      text-align: right;
      color: #0f1e19;
      font-weight: 600;
    }

    .trend-note {
      font-size: 0.74rem;
      color: #5b6d66;
      line-height: 1.4;
      margin-top: 6px;
    }

    /* tension diary (complete screen) */
    .diary {
      text-align: left;
      background: #f2f8f5;
      border: 1px solid #dce9e3;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .diary h3 {
      font-size: 0.92rem;
      font-weight: 600;
      color: #1e4d42;
    }

    .diary .setting-note {
      margin: 2px 0 8px;
    }

    .diary-field {
      display: grid;
      grid-template-columns: 4.5em 1fr 1.6em;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      padding: 3px 0;
    }

    .diary-field input {
      width: 100%;
      accent-color: #2e6b5e;
    }

    .diary-field output {
      text-align: right;
      font-weight: 600;
    }

    .diary .btn {
      margin-top: 8px;
    }

    .stats {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat {
      flex: 1;
      background: #f2f8f5;
      border: 1px solid #dce9e3;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #3d534a;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat strong {
      font-size: 1.05rem;
      color: #0f1e19;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .goal-dots {
      display: inline-flex;
      gap: 4px;
    }

    .goal-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #dce9e3;
    }

    .goal-dots span.is-done {
      background: #2e6b5e;
    }

    .safety-box {
      background: #f2f8f5;
      border: 1px solid #dce9e3;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .safety-box h3 {
      color: #1e4d42;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .safety-box p {
      font-size: 0.85rem;
      line-height: 1.45;
      color: #1e2b26;
      margin-bottom: 6px;
    }

    .safety-box p:last-child {
      margin-bottom: 0;
    }

    .tips {
      list-style: none;
      margin: 0 0 18px 0;
      padding: 0;
    }

    .tips li {
      display: flex;
      gap: 10px;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #1e2b26;
      margin-bottom: 6px;
    }

    .tips li::before {
      content: "•";
      color: #1e6b5a;
      font-weight: 700;
      font-size: 1.2rem;
      line-height: 1;
    }

    /* settings */
    .setting {
      margin-bottom: 14px;
    }

    .setting-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #3d534a;
      margin-bottom: 6px;
      display: block;
    }

    .segmented {
      display: flex;
      background: #eef5f1;
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
    }

    .segmented button {
      flex: 1;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: #3d534a;
      padding: 8px 6px;
      border-radius: 10px;
      cursor: pointer;
    }

    .segmented button[aria-pressed="true"] {
      background: #ffffff;
      color: #1e4d42;
      box-shadow: 0 2px 6px -2px rgba(30, 43, 38, 0.25);
    }

    .toggles {
      display: flex;
      gap: 8px;
    }

    .toggle {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #eef5f1;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e4d42;
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      accent-color: #2e6b5e;
      width: 16px;
      height: 16px;
    }

    .preview {
      background: #f9fbfa;
      border: 1px solid #e6efea;
      border-radius: 14px;
      padding: 10px 14px 12px;
      margin-bottom: 16px;
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .preview-head .setting-label {
      margin-bottom: 0;
    }

    .btn-small {
      border: none;
      background: #c3e1d8;
      color: #1e4d42;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .btn-small:hover {
      background: #aed6c9;
    }

    .preview ol {
      padding-left: 20px;
      font-size: 0.84rem;
      line-height: 1.55;
      color: #1e2b26;
    }

    .preview ol li::marker {
      color: #7a8f86;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px 16px;
      cursor: pointer;
      background: #2e6b5e;
      color: white;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #235a4f;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-quiet {
      background: #c3e1d8;
      color: #1e4d42;
    }

    .btn-quiet:hover {
      background: #aed6c9;
    }

    .btn-quiet:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .btn-link {
      background: none;
      border: none;
      color: #7a8f86;
      font-family: inherit;
      font-size: 0.8rem;
      text-decoration: underline;
      padding: 6px;
      cursor: pointer;
      align-self: center;
    }

    .session-card {
      text-align: center;
      padding: 20px 16px 16px;
      gap: 10px;
      display: flex;
      flex-direction: column;
    }

    .phase-label {
      font-size: 0.8rem;
      color: #3d534a;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }

    .step-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: #0f1e19;
      margin: 4px 0 2px;
      line-height: 1.3;
      word-break: break-word;
    }

    .step-desc {
      font-size: 0.88rem;
      line-height: 1.5;
      color: #1e2b26;
      max-width: 100%;
      word-break: break-word;
      margin: 6px 0 8px;
      padding: 0 4px;
      overflow: visible;
      display: block;
      white-space: normal;
    }

    .phase-label,
    .step-name,
    .step-desc {
      transition: opacity 0.2s;
    }

    .is-fading {
      opacity: 0;
    }

    .ring-wrap {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 4px auto 6px;
    }

    .ring-wrap svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .ring-track {
      fill: none;
      stroke: #c3e1d8;
      stroke-width: 12;
    }

    .ring-progress {
      fill: none;
      stroke: #2e6b5e;
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.9s linear;
    }

    .ring-wrap.is-prep .ring-progress {
      stroke: #c98a3a;
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #countdown {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0f1e19;
      line-height: 1;
    }

    .unit {
      font-size: 0.7rem;
      color: #5b6d66;
      font-weight: 500;
    }

    .cue-label {
      min-height: 1.6em;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e4d42;
    }

    .cue-label.is-hold {
      color: #c98a3a;
    }

    /* symmetry meter */
    .meter {
      background: #f2f8f5;
      border: 1px solid #dce9e3;
      border-radius: 14px;
      padding: 10px 12px;
      text-align: left;
      font-size: 0.8rem;
      color: #3d534a;
    }

    .meter[hidden] {
      display: none;
    }

    .meter-row {
      display: grid;
      grid-template-columns: 7.5em 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .meter-bar {
      height: 10px;
      background: #dce9e3;
      border-radius: 999px;
      overflow: hidden;
    }

    .meter-bar span {
      display: block;
      height: 100%;
      width: 0;
      background: #2e6b5e;
      border-radius: 999px;
      transition: width 0.12s linear;
    }

    .meter-row.is-affected .meter-bar span {
      background: #c98a3a;
    }

    .meter-row.is-affected .meter-side {
      font-weight: 600;
      color: #8a5a1c;
    }

    .meter-foot {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .meter-foot strong {
      color: #0f1e19;
    }

    .meter.no-bars .meter-row {
      display: none;
    }

    #meterStatus.is-warning {
      color: #a1461f;
      font-weight: 600;
    }

    .setting-note {
      font-size: 0.76rem;
      color: #5b6d66;
      line-height: 1.4;
      margin-top: 6px;
    }

    .toggles + .toggles {
      margin-top: 8px;
    }

    .results {
      list-style: none;
      text-align: left;
      background: #f9fbfa;
      border: 1px solid #e6efea;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 0.84rem;
    }

    .results li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 3px 0;
    }

    .results li span:last-child {
      white-space: nowrap;
      font-weight: 600;
    }

    .results li.total {
      border-top: 1px solid #e6efea;
      margin-top: 4px;
      padding-top: 7px;
      font-weight: 600;
    }

    .results[hidden] {
      display: none;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 12px 0 6px;
      flex-wrap: wrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dce9e3;
      transition: background 0.2s;
    }

    .dot.is-done {
      background: #2e6b5e;
    }

    .dot.is-current {
      background: #c98a3a;
      transform: scale(1.25);
    }

    .controls {
      display: flex;
      gap: 8px;
      margin: 12px 0 0;
    }

    .controls .btn {
      flex: 2 1 0;
    }

    .controls .btn-quiet {
      flex: 1 1 0;
    }

    /* ---- camera stage: the mirror is the main element when a camera is on ---- */
    .stage {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stage-overlay {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    video#mirror {
      display: none;
    }

    .has-camera .stage {
      position: relative;
      height: 58vh;
      height: 58dvh;
      min-height: 280px;
      border-radius: 18px;
      overflow: hidden;
      background: #0f1e19;
      margin: 2px -4px 0;
    }

    .has-camera video#mirror {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .has-camera .ring-wrap {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 92px;
      height: 92px;
      margin: 0;
      padding: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.5);
    }

    .has-camera #countdown {
      font-size: 1.4rem;
    }

    .has-camera .unit {
      font-size: 0.56rem;
    }

    .has-camera .stage-overlay {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      align-items: center;
      gap: 8px;
    }

    .has-camera .cue-label {
      min-height: 0;
      font-size: 1.3rem;
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.5);
    }

    .has-camera .cue-label:empty {
      display: none;
    }

    /* compact meter strip so it doesn't cover the mouth:
       [Left ▬▬▬] [Right · affected ▬▬▬] / status + score */
    .has-camera .meter {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 12px;
      row-gap: 4px;
      padding: 7px 10px;
      font-size: 0.74rem;
      background: rgba(255, 255, 255, 0.85);
      border: none;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    .has-camera .meter[hidden] {
      display: none;
    }

    .has-camera .meter-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 3px;
      margin: 0;
    }

    .has-camera .meter.no-bars .meter-row {
      display: none;
    }

    .has-camera .meter-side {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .has-camera .meter-bar {
      height: 8px;
    }

    .has-camera .meter-foot {
      grid-column: 1 / -1;
    }

    /* keep the session screen compact: no language switch while exercising */
    body[data-screen="session"] .topbar {
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px 8px;
      }

      .session-card {
        padding: 14px 12px 12px;
      }
    }

    .mirror-note {
      font-size: 0.78rem;
      color: #5b6d66;
      padding: 4px 0 0;
    }

    /* complete */
    .complete-card {
      text-align: center;
    }

    .complete-mark {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #f1dda6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }

    .complete-mark svg {
      width: 26px;
      height: 26px;
      stroke: #2e6b5e;
    }

    .complete-card p {
      color: #1e2b26;
      font-size: 0.92rem;
      line-height: 1.5;
      margin: 8px 0 14px;
    }

    .complete-card .stats {
      text-align: left;
    }

    .complete-card .btn-link {
      margin-top: 6px;
    }

    .footer-link {
      display: flex;
      justify-content: center;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    /* responsive */
    @media (max-height: 700px) {
      .ring-wrap {
        width: 130px;
        height: 130px;
      }

      .step-name {
        font-size: 1.1rem;
      }

      .step-desc {
        font-size: 0.82rem;
      }
    }

    @media (max-height: 600px) {
      .ring-wrap {
        width: 110px;
        height: 110px;
      }

      .step-name {
        font-size: 1rem;
      }

      .btn {
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <div class="lang-switch" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>

    <!-- INTRO -->
    <section class="screen is-active" id="screen-intro">
      <div class="card">
        <h1 data-i18n="title"></h1>
        <p class="meta" id="introMeta"></p>

        <div class="stats" id="introStats"></div>

        <details class="trends" id="trends" open hidden>
          <summary data-i18n="trends.title"></summary>
          <div id="trendsBody"></div>
        </details>

        <div class="safety-box">
          <h3 data-i18n="safety.title"></h3>
          <p data-i18n="safety.p1"></p>
          <p data-i18n="safety.p2"></p>
        </div>

        <ul class="tips">
          <li data-i18n="tips.1"></li>
          <li data-i18n="tips.2"></li>
        </ul>

        <div class="setting">
          <span class="setting-label" data-i18n="length.label"></span>
          <div class="segmented" id="lengthPicker" role="group">
            <button type="button" data-length="short" data-i18n="length.short"></button>
            <button type="button" data-length="standard" data-i18n="length.standard"></button>
            <button type="button" data-length="long" data-i18n="length.long"></button>
          </div>
        </div>

        <div class="setting">
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="soundToggle" /> <span data-i18n="toggle.sound"></span></label>
            <label class="toggle"><input type="checkbox" id="voiceToggle" /> <span data-i18n="toggle.voice"></span></label>
          </div>
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="meterToggle" /> <span data-i18n="toggle.meter"></span></label>
          </div>
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="synkinesisToggle" /> <span data-i18n="toggle.synkinesis"></span></label>
          </div>
          <p class="setting-note" id="synkinesisNote" data-i18n="synkinesis.note" hidden></p>
        </div>

        <div class="setting" id="sideSetting" hidden>
          <span class="setting-label" data-i18n="side.label"></span>
          <div class="segmented" id="sidePicker" role="group">
            <button type="button" data-side="left" data-i18n="side.left"></button>
            <button type="button" data-side="right" data-i18n="side.right"></button>
          </div>
          <p class="setting-note" data-i18n="meter.note"></p>
        </div>

        <div class="preview">
          <div class="preview-head">
            <span class="setting-label" data-i18n="preview.title"></span>
            <button type="button" class="btn-small" id="shuffleBtn" data-i18n="preview.shuffle"></button>
          </div>
          <ol id="previewList"></ol>
        </div>

      <div class="card session-card" id="sessionCard">

        <div class="stage">
          <video id="mirror" autoplay playsinline muted hidden></video>

          <div class="ring-wrap" id="ringWrap">
            <svg viewBox="0 0 220 220">
              <circle class="ring-track" cx="110" cy="110" r="94"></circle>
              <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="94"></circle>

              <span id="countdown"></span>
              <span class="unit" id="countdownUnit"></span>
            </div>
          </div>

          <div class="stage-overlay">
            <p class="cue-label" id="cueLabel"></p>

            <div class="meter" id="meter" hidden>
              <div class="meter-row" data-side="left">
                <span class="meter-side"></span>
                <div class="meter-bar"><span></span></div>
              </div>
              <div class="meter-row" data-side="right">

                <div class="meter-bar"><span></span></div>
              </div>

              </div>

          </div>
        </div>

        <div class="dots" id="dots"></div>

        <div class="controls">

      </div>
    </section>

    <!-- COMPLETE -->

            <polyline points="20 6 9 17 4 12"></polyline>

        </div>

        <h2 data-i18n="complete.title"></h2>

        <p id="completeMsg"></p>

        <div class="stats" id="completeStats"></div>

        <button type="button" class="btn-link" id="homeBtn" data-i18n="complete.home"></button>
      </div>
    </section>

    const LENGTHS = {
      short: { count: 4, exercise: 60, warmup: 30, cooldown: 30 },
      standard: { count: 7, exercise: 60, warmup: 60, cooldown: 120 },
      long: { count: 11, exercise: 60, warmup: 60, cooldown: 120 },
    };

    const PREP_SECONDS = 6;
    const DAILY_GOAL = 2;
    const CIRCUMFERENCE = 2 * Math.PI * 94;

    /* ------------------------------------------------------------------ */
    /* Storage                                                             */
    /* ------------------------------------------------------------------ */
    const store = {
      get(key, fallback) {
        try {
          const raw = localStorage.getItem("bpt." + key);
          return raw === null ? fallback : JSON.parse(raw);
        } catch {
          return fallback;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem("bpt." + key, JSON.stringify(value));
        } catch {
          /* storage unavailable: settings just won't persist */
        }
      },
    };

    const settings = {
      lang: store.get("lang", (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en"),
      length: store.get("length", "standard"),
      sound: store.get("sound", true),
      voice: store.get("voice", false),
      meter: store.get("meter", false),
      side: store.get("side", "right"),
      synkinesis: store.get("synkinesis", false),
    };
    if (!I18N[settings.lang]) settings.lang = "en";
    if (settings.side !== "left" && settings.side !== "right") settings.side = "right";
    if (!LENGTHS[settings.length]) settings.length = "standard";

    function t(key, vars = {}) {
      let str = I18N[settings.lang][key] ?? I18N.en[key] ?? key;
      for (const [k, v] of Object.entries(vars)) str = str.replaceAll(`{${k}}`, v);
      return str;
    }

    /* ------------------------------------------------------------------ */
    /* State                                                               */
    /* ------------------------------------------------------------------ */
    let routine = [];
    let stepIndex = 0;
    let phase = "prep";
    let timeLeft = PREP_SECONDS;
    let phaseDuration = PREP_SECONDS;
    let timerId = null;
    let isPaused = false;
    let inSession = false;
    let lastCueKey = null;
    let cameraStream = null;
    let wakeLock = null;
    let audioCtx = null;

    const $ = (id) => document.getElementById(id);

    const els = {
      screens: {
        intro: $("screen-intro"),
        session: $("screen-session"),
        complete: $("screen-complete"),
      },
      introMeta: $("introMeta"),
      introStats: $("introStats"),
      lengthPicker: $("lengthPicker"),
      soundToggle: $("soundToggle"),
      voiceToggle: $("voiceToggle"),
      meterToggle: $("meterToggle"),
      sessionCard: $("sessionCard"),
      synkinesisToggle: $("synkinesisToggle"),
      synkinesisNote: $("synkinesisNote"),
      sideSetting: $("sideSetting"),
      sidePicker: $("sidePicker"),
      meter: $("meter"),
      meterStatus: $("meterStatus"),
      meterScore: $("meterScore"),
      symmetryResults: $("symmetryResults"),
      trends: $("trends"),
      trendsBody: $("trendsBody"),
      diary: $("diary"),
      diaryFields: $("diaryFields"),
      diarySave: $("diarySave"),
      previewList: $("previewList"),
      shuffleBtn: $("shuffleBtn"),
      resetHistoryBtn: $("resetHistoryBtn"),
      phaseLabel: $("phaseLabel"),
      stepName: $("stepName"),
      stepDesc: $("stepDesc"),
      cueLabel: $("cueLabel"),
      ringWrap: $("ringWrap"),
      ringProgress: $("ringProgress"),
      countdown: $("countdown"),
      countdownUnit: $("countdownUnit"),
      dots: $("dots"),
      prevBtn: $("prevBtn"),
      pauseBtn: $("pauseBtn"),
      skipBtn: $("skipBtn"),
      endBtn: $("endBtn"),
      beginBtn: $("beginBtn"),
      restartBtn: $("restartBtn"),
      homeBtn: $("homeBtn"),
      completeMsg: $("completeMsg"),
      completeStats: $("completeStats"),
      mirror: $("mirror"),
      mirrorNote: $("mirrorNote"),
      liveRegion: $("liveRegion"),

    els.ringProgress.style.strokeDasharray = String(CIRCUMFERENCE);

    /* ------------------------------------------------------------------ */
    /* Routine generation                                                  */
    /* ------------------------------------------------------------------ */
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildRoutine(lengthKey) {
      const cfg = LENGTHS[lengthKey];

      // With synkinesis mode on, about a third of the routine are synkinesis
      // exercises and strengthening that can worsen synkinesis is left out.
      // With it off, synkinesis exercises are not used.
      const allowed = POOL.filter((ex) => (settings.synkinesis ? !ex.avoidWithSynkinesis : !ex.synkinesis));
      const synk = shuffle(allowed.filter((ex) => ex.synkinesis)).slice(0, Math.ceil(cfg.count / 3));
      const regular = allowed.filter((ex) => !ex.synkinesis);

      // Bucket the regular pool by face area, shuffle each bucket.
      const buckets = {};
      GROUPS.forEach((g) => (buckets[g] = shuffle(regular.filter((ex) => ex.group === g))));

      // Round-robin over groups so even short routines cover several areas.
      // Eyes and mouth come first: they matter most for daily function.
      const order = ["eyes", "mouth", ...shuffle(GROUPS.filter((g) => g !== "eyes" && g !== "mouth"))];
      const picked = [...synk];
      while (picked.length < cfg.count && order.some((g) => buckets[g].length)) {
        for (const g of order) {
          if (picked.length >= cfg.count) break;
          if (buckets[g].length) picked.push(buckets[g].pop());
        }
      }

      // Natural flow: top of the face to the bottom.
      picked.sort((a, b) => GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group));

      return [
        { ...WARMUP, duration: cfg.warmup },
        ...picked.map((ex) => ({ ...ex, duration: cfg.exercise })),
        { ...COOLDOWN, duration: cfg.cooldown },
      ];
    }

    function stepTitle(step) {
      const name = step.name[settings.lang] ?? step.name.en;
      if (step.massage) return name;
      const detail = step.titleReps ? t("reps", { r: step.reps }) : t("repsHold", { r: step.reps, h: step.hold });
      return `${name} (${detail})`;
    }

    function stepDescription(step) {
      const desc = step.desc[settings.lang] ?? step.desc.en;
      return step.massage ? desc.replaceAll("{n}", Math.round(step.duration / MASSAGE_AREAS)) : desc;
    }

    function totalMinutes() {
      const seconds = routine.reduce((sum, s) => sum + s.duration + PREP_SECONDS, 0);
      return Math.max(1, Math.round(seconds / 60));
    }

    /* ------------------------------------------------------------------ */
    /* History                                                             */
    /* ------------------------------------------------------------------ */
    function dayKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getHistory() {
      const h = store.get("history", []);
      return Array.isArray(h) ? h : [];
    }

    function recordSession(completed) {
      const history = getHistory();
      const entry = { date: dayKey(), ts: Date.now(), length: settings.length, completed };
      const symmetry = completed ? sessionSymmetry() : null;
      if (symmetry != null) {
        entry.symmetry = symmetry;
        entry.perExercise = { ...sessionResults };
      }
      if (completed && Object.keys(sessionCoact).length) entry.coactivation = { ...sessionCoact };
      if (completed && sessionRestSummary) entry.rest = sessionRestSummary;
      history.push(entry);
      store.set("history", history.slice(-1000));
    }

    function todayCount() {
      const today = dayKey();
      return getHistory().filter((s) => s.completed && s.date === today).length;
    }

    function streakDays() {
      const days = new Set(getHistory().filter((s) => s.completed).map((s) => s.date));
      const cursor = new Date();
      if (!days.has(dayKey(cursor))) cursor.setDate(cursor.getDate() - 1); // today not done yet: count from yesterday
      let streak = 0;
      while (days.has(dayKey(cursor))) {
        streak += 1;
        cursor.setDate(cursor.getDate() - 1);
      }
      return streak;
    }

    function renderStats(container) {
      const count = todayCount();
      const streak = streakDays();
      const dots = Array.from({ length: DAILY_GOAL }, (_, i) =>
        `<span class="${i < count ? "is-done" : ""}"></span>`
      ).join("");
      const streakText = streak === 1 ? t("stats.day") : t("stats.days", { n: streak });

      container.innerHTML = `
        <div class="stat">${t("stats.today")}
          <strong>${t("stats.todayValue", { n: count })} <span class="goal-dots">${dots}</span></strong>
        </div>
        <div class="stat">${t("stats.streak")}
          <strong>🔥 ${streakText}</strong>
        </div>${symmetryTile()}`;
    }

    // Latest measured symmetry, compared with the measurement about a week before it.
    function symmetryTile() {
      const measured = getHistory().filter((s) => typeof s.symmetry === "number");
      if (!measured.length) return "";
      const latest = measured[measured.length - 1];
      const weekBefore = [...measured].reverse().find((s) => s.ts <= latest.ts - 6 * 24 * 3600 * 1000);
      let change = "";
      if (weekBefore) {
        const d = latest.symmetry - weekBefore.symmetry;
        const arrow = d > 0 ? "↑" : d < 0 ? "↓" : "→";
        change = `<span>${arrow} ${t("stats.symChange", { d: (d > 0 ? "+" : "") + d })}</span>`;
      }
      return `
        <div class="stat">${t("stats.symmetry")}
          <strong>${latest.symmetry} %</strong>${change}
        </div>`;
    }

    /* ------------------------------------------------------------------ */
    /* Sound & voice                                                       */
    /* ------------------------------------------------------------------ */
    function ensureAudio() {
      if (!settings.sound) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function tone(freq, duration = 0.15, delay = 0, volume = 0.18) {
      if (!settings.sound || !audioCtx) return;
      const start = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + duration + 0.05);
    }

    const sounds = {
      prep: () => tone(520, 0.18),
      start: () => {
        tone(660, 0.14);
        tone(880, 0.2, 0.16);
      },
      hold: () => tone(740, 0.1, 0, 0.1),
      relax: () => tone(440, 0.1, 0, 0.08),
      warn: () => tone(330, 0.25, 0, 0.12),
      finish: () => {
        tone(523, 0.2);
        tone(659, 0.2, 0.18);
        tone(784, 0.35, 0.36);
      },
    };

    function speak(text) {
      if (!settings.voice || !("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const lang = t("speechLang");
      u.lang = lang;
      const voice = speechSynthesis.getVoices().find((v) => v.lang.replace("_", "-").startsWith(lang.slice(0, 2)));
      if (voice) u.voice = voice;
      u.rate = 0.95;
      speechSynthesis.speak(u);
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) speechSynthesis.cancel();
    }

    /* Which cue applies `elapsed` seconds into the active phase of `step`. */
    function cueState(step, elapsed) {
      if (step.massage) {
        const seg = step.duration / MASSAGE_AREAS;
        const idx = Math.min(MASSAGE_AREAS - 1, Math.floor(elapsed / seg));
        const area = t(`area.${idx}`);
        return { key: `area${idx}`, label: area, speech: area, hold: false };
      }

      const cycle = Math.floor(step.duration / step.reps);
      const rep = Math.floor(elapsed / cycle);
      if (rep >= step.reps) {
        return { key: "done", label: t("cue.done"), speech: null, hold: false };
      }
      const holding = elapsed - rep * cycle < step.hold;
      const holdWord = step.cues ? t(step.cues[rep % step.cues.length]) : t("cue.hold");
      const word = holding ? holdWord : t("cue.relax");
      return {
        key: `${rep}${holding ? "h" : "r"}`,
        label: `${t("rep")} ${rep + 1}/${step.reps} · ${word}`,
        speech: word,
        hold: holding,
      };
    }

    function updateCue(fire) {
      if (phase !== "active") {
        els.cueLabel.textContent = "";
        els.cueLabel.classList.remove("is-hold");
        return;
      }
      const step = routine[stepIndex];
      const state = cueState(step, phaseDuration - timeLeft);
      els.cueLabel.textContent = state.label;
      els.cueLabel.classList.toggle("is-hold", state.hold);

      if (!fire || state.key === lastCueKey) return;
      const isFirst = lastCueKey === null;
      lastCueKey = state.key;

      if (settings.voice && state.speech) {
        speak(state.speech);
      } else if (!isFirst && !step.massage) {
        // First cue coincides with the start sound; don't double up.
        state.hold ? sounds.hold() : sounds.relax();
      }
      if (step.massage && !isFirst) sounds.hold();
    }

    /* ------------------------------------------------------------------ */
    /* Wake lock & camera                                                  */
    /* ------------------------------------------------------------------ */
    async function requestWakeLock() {
      if (!("wakeLock" in navigator) || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => (wakeLock = null));
      } catch {
        wakeLock = null;
      }
    }

    function releaseWakeLock() {
      if (wakeLock) wakeLock.release().catch(() => {});
      wakeLock = null;
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && inSession) requestWakeLock();
    });

    async function enableCamera() {
      if (cameraStream) return;
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } },
        });
        if (!inSession) {
          stopCamera(); // session ended while the permission prompt was open
          return;
        }
        els.mirror.srcObject = cameraStream;
        els.mirror.hidden = false;
        els.mirrorNote.hidden = true;
        els.sessionCard.classList.add("has-camera");
      } catch {
        els.mirror.hidden = true;
        els.mirrorNote.hidden = false;
        els.sessionCard.classList.remove("has-camera");
      }
    }

    function stopCamera() {
      if (cameraStream) cameraStream.getTracks().forEach((track) => track.stop());
      cameraStream = null;
      els.mirror.srcObject = null;
      els.mirror.hidden = true;
      els.sessionCard.classList.remove("has-camera");
    }

    /* ------------------------------------------------------------------ */
    /* Symmetry meter (camera biofeedback)                                 */
    /* ------------------------------------------------------------------ */
    const MEDIAPIPE_BASE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3";
    const FACE_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
    // MediaPipe names blendshapes like ARKit: "...Left" = the person's own left side.
    // If a wink test shows the bars swapped, set this to true.
    const SWAP_SIDES = false;
    const MIN_ACTIVITY = 0.1; // ignore reps where neither side moved noticeably
    const COACT_THRESHOLD = 0.2; // movement of a "watch" signal that counts as co-movement
    const SAMPLE_INTERVAL_MS = 66; // ~15 measurements per second

    // An activity source reports per-side muscle activity (0..1) for a list of
    // signal names. Today the camera is the only source; an EMG device (see
    // docs/biofeedback.md) can implement the same load / start / stop / read API.
    const cameraSource = {
      status: "off", // off | loading | ready | error
      landmarker: null,
      scores: null, // latest blendshape scores by name; null when no face is visible
      rafId: null,
      lastRun: 0,
      onSample: null,

      async load() {
        if (this.landmarker || this.status === "loading") return;
        this.status = "loading";
        try {
          const vision = await import(`${MEDIAPIPE_BASE}/vision_bundle.mjs`);
          const fileset = await vision.FilesetResolver.forVisionTasks(`${MEDIAPIPE_BASE}/wasm`);
          const create = (delegate) =>
            vision.FaceLandmarker.createFromOptions(fileset, {
              baseOptions: { modelAssetPath: FACE_MODEL_URL, delegate },
              runningMode: "VIDEO",
              numFaces: 1,
              outputFaceBlendshapes: true,
            });
          try {
            this.landmarker = await create("GPU");
          } catch {
            this.landmarker = await create("CPU");
          }
          this.status = "ready";
        } catch (err) {
          console.warn("Face tracking unavailable:", err);
          this.status = "error";
        }
      },

      start(onSample) {
        this.onSample = onSample;
        if (this.rafId) return;
        const loop = (now) => {
          this.rafId = requestAnimationFrame(loop);
          if (now - this.lastRun < SAMPLE_INTERVAL_MS) return;
          this.lastRun = now;
          const video = els.mirror;
          if (this.status === "ready" && cameraStream && video.readyState >= 2) {
            try {
              const result = this.landmarker.detectForVideo(video, now);
              const cats = result.faceBlendshapes?.[0]?.categories;
              const landmarks = result.faceLandmarks?.[0];
              this.scores = cats
                ? {
                    ...Object.fromEntries(cats.map((c) => [c.categoryName, c.score])),
                    ...derivedSignals(landmarks, video.videoWidth, video.videoHeight),
                  }
                : null;
            } catch {
              this.scores = null;
            }
          }
          this.onSample?.();
        };
        this.rafId = requestAnimationFrame(loop);
      },

      stop() {
        cancelAnimationFrame(this.rafId);
        this.rafId = null;
        this.scores = null;
      },

      read(names) {
        if (!this.scores) return null;
        const side = (suffix) => Math.max(...names.map((n) => this.scores[n + suffix] ?? 0));
        const left = side("Left");
        const right = side("Right");
        return SWAP_SIDES ? { left: right, right: left } : { left, right };
      },
    };

    // Per-side signals MediaPipe has no left/right blendshape for (it only
    // reports one "mouthPucker" value), computed from the face landmarks.
    // Landmark sides follow MediaPipe's convention, like the blendshapes:
    // 291 is the person's left mouth corner, 61 the right one.
    const LANDMARK = {
      noseBridge: 168,
      chin: 152,
      faceRight: 234,
      faceLeft: 454,
      mouthLeft: 291,
      mouthRight: 61,
      // eyes: upper lid, lower lid, outer corner, inner corner
      eyeLeft: [386, 374, 263, 362],
      eyeRight: [159, 145, 33, 133],
    };
    const CORNER_IN_SCALE = 5; // makes a typical pucker (~5% of face width) comparable to blendshape values

    function derivedSignals(lm, width, height) {
      if (!lm || !width || !height) return {};
      const pt = (i) => ({ x: lm[i].x * width, y: lm[i].y * height });
      const top = pt(LANDMARK.noseBridge);
      const bottom = pt(LANDMARK.chin);
      const dx = bottom.x - top.x;
      const dy = bottom.y - top.y;
      const midLen = Math.hypot(dx, dy);
      const faceRight = pt(LANDMARK.faceRight);
      const faceLeft = pt(LANDMARK.faceLeft);
      const faceWidth = Math.hypot(faceLeft.x - faceRight.x, faceLeft.y - faceRight.y);
      if (!midLen || !faceWidth) return {};
      // distance of a point from the face midline (nose bridge to chin), in face widths
      const fromMidline = (p) => Math.abs((p.x - top.x) * dy - (p.y - top.y) * dx) / midLen / faceWidth;
      // Rises as the mouth corner moves in towards the midline (pucker, whistle, "O").
      const cornerIn = (i) => (0.5 - fromMidline(pt(i))) * CORNER_IN_SCALE;
      // Resting-face metrics (see collectRest): eye opening = lid gap ÷ eye width;
      // corner drop = how far down the midline the mouth corner sits, in face widths.
      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const eyeOpen = ([up, low, outer, inner]) => dist(pt(up), pt(low)) / dist(pt(outer), pt(inner));
      const cornerDrop = (i) => {
        const p = pt(i);
        return ((p.x - top.x) * dx + (p.y - top.y) * dy) / midLen / faceWidth;
      };
      return {
        mouthCornerInLeft: cornerIn(LANDMARK.mouthLeft),
        mouthCornerInRight: cornerIn(LANDMARK.mouthRight),
        eyeOpenLeft: eyeOpen(LANDMARK.eyeLeft),
        eyeOpenRight: eyeOpen(LANDMARK.eyeRight),
        cornerDropLeft: cornerDrop(LANDMARK.mouthLeft),
        cornerDropRight: cornerDrop(LANDMARK.mouthRight),
      };
    }

    const activitySource = cameraSource;

    let measure = null; // measurement state of the current step
    let sessionResults = {}; // exercise id -> symmetry %
    let sessionCoact = {}; // exercise id -> { n: reps with co-movement, of: reps measured }

    const mean = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;

    function median(arr) {
      if (!arr.length) return 0;
      const sorted = [...arr].sort((a, b) => a - b);
      return sorted[Math.floor(sorted.length / 2)];
    }

    function resetMeasure() {
      measure = {
        rest: { left: [], right: [] },
        base: null,
        peak: null,
        repKey: null,
        reps: [],
        max: 0.2,
        lastScore: null,
        // synkinesis watch (affected side only)
        watchRest: [],
        watchBase: null,
        watchPeak: 0,
        watchReps: 0,
        coactReps: 0,
        coactNow: false,
      };
    }

    function finishRep() {
      if (!measure) return;
      if (measure.peak && routine[stepIndex]?.watch && measure.watchBase != null) {
        measure.watchReps += 1;
        if (measure.watchPeak >= COACT_THRESHOLD) measure.coactReps += 1;
      }
      measure.watchPeak = 0;
      measure.coactNow = false;
      if (measure.peak && routine[stepIndex]?.meter) {
        const { left, right } = measure.peak;
        const high = Math.max(left, right);
        if (high >= MIN_ACTIVITY) {
          measure.lastScore = Math.round((Math.min(left, right) / high) * 100);
          measure.reps.push(measure.lastScore);
        }
      }
      measure.peak = null;
    }

    function finishStepMeasure() {
      const step = routine[stepIndex];
      if (!measure || !(step?.meter || step?.watch)) return;
      finishRep();
      if (measure.reps.length) sessionResults[step.id] = Math.round(mean(measure.reps));
      if (measure.watchReps) sessionCoact[step.id] = { n: measure.coactReps, of: measure.watchReps };
    }

    function renderMeterLabels() {
      els.meter.querySelectorAll(".meter-row").forEach((row) => {
        const affected = row.dataset.side === settings.side;
        row.classList.toggle("is-affected", affected);
        row.querySelector(".meter-side").textContent =
          t(`meter.${row.dataset.side}`) + (affected ? ` · ${t("meter.affected")}` : "");
      });
    }

    function setBars(activity) {
      els.meter.querySelectorAll(".meter-row").forEach((row) => {
        const value = activity[row.dataset.side] / (measure?.max || 1);
        row.querySelector(".meter-bar span").style.width = `${Math.min(100, value * 100)}%`;
      });
    }

    /* Resting asymmetry: sampled in the last seconds of every "up next"
       countdown, when the face is relaxed. Stored per person-side, so the
       affected side can still be changed later. */
    const REST_KEYS = ["eyeOpenLeft", "eyeOpenRight", "cornerDropLeft", "cornerDropRight"];
    const REST_MIN_SAMPLES = 20;
    let sessionRest = null; // key -> samples
    let sessionRestSummary = null; // key -> median, plus n

    function resetRest() {
      sessionRest = Object.fromEntries(REST_KEYS.map((k) => [k, []]));
      sessionRestSummary = null;
    }

    function collectRest() {
      if (!inSession || !sessionRest || phase !== "prep" || isPaused || timeLeft > 4) return;
      const s = activitySource.scores;
      if (!s || s.eyeOpenLeft == null) return;
      REST_KEYS.forEach((k) => sessionRest[k].push(s[k]));
    }

    function summarizeRest() {
      if (!sessionRest || sessionRest.eyeOpenLeft.length < REST_MIN_SAMPLES) return null;
      const summary = Object.fromEntries(REST_KEYS.map((k) => [k, +median(sessionRest[k]).toFixed(4)]));
      summary.n = sessionRest.eyeOpenLeft.length;
      return summary;
    }

    // Rest metrics seen from the affected side.
    function restView(rest) {
      const aff = settings.side === "left" ? "Left" : "Right";
      const healthy = aff === "Left" ? "Right" : "Left";
      return {
        eye: Math.round((rest["eyeOpen" + aff] / rest["eyeOpen" + healthy]) * 100),
        // positive = affected mouth corner sits higher, in % of face width
        mouth: +((rest["cornerDrop" + healthy] - rest["cornerDrop" + aff]) * 100).toFixed(1),
      };
    }

    function mouthText(value) {
      if (Math.abs(value) < 0.5) return t("rest.level");
      const n = Math.abs(value).toLocaleString(settings.lang, { maximumFractionDigits: 1 });
      return value > 0 ? t("rest.higher", { n }) : t("rest.lower", { n });
    }

    function onMeterSample() {
      collectRest();
      const step = routine[stepIndex];
      const show = Boolean(settings.meter && inSession && cameraStream && (step?.meter || step?.watch));
      els.meter.hidden = !show;
      if (!show) return;
      els.meter.classList.toggle("no-bars", !step.meter);

      let raw = null;
      let status;
      if (activitySource.status === "loading") status = t("meter.loading");
      else if (activitySource.status === "error") status = t("meter.error");
      else {
        raw = activitySource.read(step.meter ?? step.watch);
        status = !raw ? t("meter.noFace") : phase === "prep" ? t("meter.calibrating") : t("meter.measuring");
      }

      // Watched signal on the affected side (synkinesis exercises).
      const watched = raw && step.watch ? activitySource.read(step.watch)[settings.side] : null;

      let activity = { left: 0, right: 0 };
      if (raw && measure && !isPaused) {
        if (phase === "prep") {
          // Face at rest before the exercise: collect the baseline.
          measure.rest.left.push(raw.left);
          measure.rest.right.push(raw.right);
          if (watched != null) measure.watchRest.push(watched);
        } else {
          if (!measure.base) measure.base = { left: median(measure.rest.left), right: median(measure.rest.right) };
          activity = {
            left: Math.max(0, raw.left - measure.base.left),
            right: Math.max(0, raw.right - measure.base.right),
          };
          measure.max = Math.max(measure.max, activity.left, activity.right);

          const cue = cueState(step, phaseDuration - timeLeft);
          const repKey = cue.hold ? cue.key : null;
          if (repKey !== measure.repKey) {
            finishRep();
            measure.repKey = repKey;
          }
          if (repKey) {
            measure.peak ??= { left: 0, right: 0 };
            measure.peak.left = Math.max(measure.peak.left, activity.left);
            measure.peak.right = Math.max(measure.peak.right, activity.right);
          }

          if (watched != null) {
            measure.watchBase ??= median(measure.watchRest);
            const coact = Math.max(0, watched - measure.watchBase);
            if (repKey) {
              measure.watchPeak = Math.max(measure.watchPeak, coact);
              if (coact >= COACT_THRESHOLD && !measure.coactNow) {
                measure.coactNow = true;
                sounds.warn();
              }
            }
          }
        }
      }

      if (measure?.coactNow) status = t("meter.coact");
      els.meterStatus.classList.toggle("is-warning", Boolean(measure?.coactNow));
      setBars(activity);
      els.meterStatus.textContent = status;
      els.meterScore.textContent = measure?.lastScore != null ? t("meter.score", { n: measure.lastScore }) : "";
    }

    function sessionSymmetry() {
      const values = Object.values(sessionResults);
      return values.length ? Math.round(mean(values)) : null;
    }

    /* ------------------------------------------------------------------ */
    /* Rendering                                                           */
    /* ------------------------------------------------------------------ */
    function showScreen(name) {
      Object.entries(els.screens).forEach(([key, el]) => el.classList.toggle("is-active", key === name));
      document.body.dataset.screen = name;
    }

    function applyLanguage() {
      document.documentElement.lang = settings.lang;
      document.title = t("title");
      document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
      document.querySelectorAll(".lang-switch button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.lang === settings.lang))
      );
      els.prevBtn.setAttribute("aria-label", t("prev"));
      els.prevBtn.title = t("prev");
      els.skipBtn.setAttribute("aria-label", t("skip"));
      els.skipBtn.title = t("skip");
      els.pauseBtn.textContent = isPaused ? t("resume") : t("pause");

      renderMeterLabels();
      renderIntro();
      if (inSession) {
        renderStepText();
        renderTick();
        updateCue(false);
      }
      if (els.screens.complete.classList.contains("is-active")) renderComplete();
    }

    function renderIntro() {
      els.introMeta.textContent = t("meta", { n: routine.length, m: totalMinutes() });
      els.previewList.innerHTML = "";
      routine.forEach((step) => {
        const li = document.createElement("li");
        li.textContent = stepTitle(step);
        els.previewList.appendChild(li);
      });
      els.lengthPicker.querySelectorAll("button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.length === settings.length))
      );
      els.soundToggle.checked = settings.sound;
      els.voiceToggle.checked = settings.voice;
      els.meterToggle.checked = settings.meter;
      els.synkinesisToggle.checked = settings.synkinesis;
      els.synkinesisNote.hidden = !settings.synkinesis;
      els.sideSetting.hidden = !settings.meter;
      els.sidePicker.querySelectorAll("button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.side === settings.side))
      );
      renderStats(els.introStats);
      renderTrends();
    }

    function renderComplete() {
      els.completeMsg.textContent = todayCount() >= DAILY_GOAL ? t("complete.goalReached") : t("complete.oneMore");
      renderStats(els.completeStats);

      const total = sessionSymmetry();
      const rows = routine
        .filter((step) => step.id in sessionResults || step.id in sessionCoact)
        .map((step) => {
          const parts = [];
          if (step.id in sessionResults) parts.push(`${sessionResults[step.id]} %`);
          const c = sessionCoact[step.id];
          if (c) parts.push((c.n ? "⚠ " : "") + t("results.coact", { n: c.n, of: c.of }));
          return { label: step.name[settings.lang] ?? step.name.en, value: parts.join(" · ") };
        });
      if (sessionRestSummary) {
        const rest = restView(sessionRestSummary);
        rows.push({ label: t("rest.eyeResult"), value: t("rest.eyeValue", { n: rest.eye }) });
        rows.push({ label: t("rest.mouthResult"), value: mouthText(rest.mouth) });
      }
      if (total != null) rows.push({ label: t("results.total"), value: `${total} %`, total: true });

      els.symmetryResults.hidden = rows.length === 0;
      els.symmetryResults.innerHTML = "";
      rows.forEach((row) => {
        const li = document.createElement("li");
        if (row.total) li.className = "total";
        li.append(Object.assign(document.createElement("span"), { textContent: row.label }));
        li.append(Object.assign(document.createElement("span"), { textContent: row.value }));
        els.symmetryResults.appendChild(li);
      });
    }

    function buildDots() {
      els.dots.innerHTML = "";
      routine.forEach(() => {
        const dot = document.createElement("div");
        dot.className = "dot";
        els.dots.appendChild(dot);
      });
    }

    function updateDots() {
      [...els.dots.children].forEach((dot, i) => {
        dot.classList.toggle("is-done", i < stepIndex);
        dot.classList.toggle("is-current", i === stepIndex);
      });
    }

    function formatTime(sec) {
      if (sec < 60) {
        return { value: String(sec), unit: sec === 1 ? t("unit.second") : t("unit.seconds") };
      }
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return { value: `${m}:${String(s).padStart(2, "0")}`, unit: t("unit.minutes") };
    }

    function renderTick() {
      const { value, unit } = formatTime(timeLeft);
      els.countdown.textContent = value;
      els.countdownUnit.textContent = phase === "prep" ? t("startingIn") : unit;
      const fractionElapsed = (phaseDuration - timeLeft) / phaseDuration;
      els.ringProgress.style.strokeDashoffset = String(CIRCUMFERENCE * fractionElapsed);
    }

    function renderStepText() {
      const step = routine[stepIndex];
      els.phaseLabel.textContent =
        phase === "prep" ? t("upNext") : t("stepOf", { i: stepIndex + 1, n: routine.length });
      els.stepName.textContent = stepTitle(step);
      els.stepDesc.textContent = stepDescription(step);
    }

    function crossfade(updateFn) {
      const fading = [els.phaseLabel, els.stepName, els.stepDesc];
      fading.forEach((el) => el.classList.add("is-fading"));
      window.setTimeout(() => {
        updateFn();
        fading.forEach((el) => el.classList.remove("is-fading"));
      }, 200);
    }

    function announce(text) {
      els.liveRegion.textContent = text;
    }

    /* ------------------------------------------------------------------ */
    /* Tension diary & trends                                              */
    /* ------------------------------------------------------------------ */
    const TENSION_AREAS = ["eye", "cheek", "mouth", "chin", "neck"];
    let lastSessionTs = null; // the history entry the diary is saved to

    // Sliders prefilled with the last saved ratings, so saving is one tap.
    function buildDiary() {
      const last = getHistory().filter((s) => s.tension).at(-1)?.tension ?? {};
      els.diaryFields.innerHTML = "";
      TENSION_AREAS.forEach((area) => {
        const value = last[area] ?? 0;
        const row = document.createElement("label");
        row.className = "diary-field";
        row.innerHTML = `<span data-i18n="tarea.${area}">${t(`tarea.${area}`)}</span>
          <input type="range" min="0" max="10" step="1" name="${area}" value="${value}" />
          <output>${value}</output>`;
        const input = row.querySelector("input");
        input.addEventListener("input", () => (row.querySelector("output").textContent = input.value));
        els.diaryFields.appendChild(row);
      });
      els.diarySave.disabled = false;
      els.diarySave.dataset.i18n = "tension.save";
      els.diarySave.textContent = t("tension.save");
    }

    function saveDiary(event) {
      event.preventDefault();
      const tension = Object.fromEntries(
        TENSION_AREAS.map((area) => [area, Number(els.diary.elements[area].value)])
      );
      const history = getHistory();
      const entry = history.find((s) => s.ts === lastSessionTs) ?? history.at(-1);
      if (!entry) return;
      entry.tension = tension;
      store.set("history", history);
      els.diarySave.disabled = true;
      els.diarySave.dataset.i18n = "tension.saved";
      els.diarySave.textContent = t("tension.saved");
    }

    function sparkline(values, min, max) {
      if (values.length < 2) return "<span></span>";
      if (max - min < 1e-6) {
        min -= 1;
        max += 1;
      }
      const w = 90;
      const h = 22;
      const points = values
        .map((v, i) => {
          const x = (i / (values.length - 1)) * (w - 4) + 2;
          const y = h - 3 - ((Math.min(max, Math.max(min, v)) - min) / (max - min)) * (h - 6);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        })
        .join(" ");
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
        <polyline points="${points}" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" /></svg>`;
    }

    const TREND_POINTS = 14;

    function trendRow(label, values, min, max, latestText) {
      const row = document.createElement("div");
      row.className = "trend-row";
      row.innerHTML = `<span></span>${sparkline(values, min, max)}<strong></strong>`;
      row.firstChild.textContent = label;
      row.lastChild.textContent = latestText;
      return row;
    }

    function renderTrends() {
      const history = getHistory().filter((s) => s.completed);
      const tensionEntries = history.filter((s) => s.tension).slice(-TREND_POINTS);
      const restEntries = history.filter((s) => s.rest).slice(-TREND_POINTS);
      els.trends.hidden = !tensionEntries.length && !restEntries.length;
      els.trendsBody.innerHTML = "";

      if (tensionEntries.length) {
        const h4 = document.createElement("h4");
        h4.textContent = t("trends.tension");
        els.trendsBody.appendChild(h4);
        TENSION_AREAS.forEach((area) => {
          const values = tensionEntries.map((s) => s.tension[area]).filter((v) => typeof v === "number");
          if (values.length) els.trendsBody.appendChild(trendRow(t(`tarea.${area}`), values, 0, 10, String(values.at(-1))));
        });
      }

      if (restEntries.length) {
        const h4 = document.createElement("h4");
        h4.textContent = t("trends.rest");
        els.trendsBody.appendChild(h4);
        const views = restEntries.map((s) => restView(s.rest));
        const eyes = views.map((v) => v.eye);
        const mouths = views.map((v) => v.mouth);
        els.trendsBody.appendChild(
          trendRow(t("rest.eye"), eyes, Math.min(...eyes), Math.max(...eyes), t("rest.eyeValue", { n: eyes.at(-1) }))
        );
        els.trendsBody.appendChild(
          trendRow(t("rest.mouth"), mouths, Math.min(...mouths), Math.max(...mouths), mouthText(mouths.at(-1)))
        );
        const note = document.createElement("p");
        note.className = "trend-note";
        note.textContent = t("rest.note");
        els.trendsBody.appendChild(note);
      }
    }

    /* ------------------------------------------------------------------ */
    /* Session flow                                                        */
    /* ------------------------------------------------------------------ */
    function beginPhase(nextPhase) {
      phase = nextPhase;
      const step = routine[stepIndex];
      const name = step.name[settings.lang] ?? step.name.en;

      phaseDuration = phase === "prep" ? PREP_SECONDS : step.duration;
      timeLeft = phaseDuration;
      lastCueKey = null;
      if (phase === "prep") resetMeasure();
      els.ringWrap.classList.toggle("is-prep", phase === "prep");
      els.prevBtn.disabled = stepIndex === 0 && phase === "prep";

      if (phase === "prep") {
        sounds.prep();
        speak(t("announce.prep", { name }));
        announce(t("announce.prep", { name }));
      } else {
        sounds.start();
        announce(t("announce.now", { name }));
      }

      crossfade(() => {
        renderStepText();
        updateDots();
      });
      renderTick();
      updateCue(true);
      startTimer();
    }

    function startTimer() {
      clearInterval(timerId);
      timerId = setInterval(() => {
        if (isPaused) return;
        timeLeft -= 1;
        if (timeLeft <= 0) {
          clearInterval(timerId);
          advance();
        } else {
          renderTick();
          updateCue(true);
        }
      }, 1000);
    }

    function advance() {
      if (phase === "prep") {
        beginPhase("active");
      } else {
        finishStepMeasure();
        stepIndex += 1;
        if (stepIndex >= routine.length) finishSession();
        else beginPhase("prep");
      }
    }

    function setPaused(value) {
      isPaused = value;
      els.pauseBtn.textContent = isPaused ? t("resume") : t("pause");
      if (isPaused) stopSpeech();
    }

    function startSession() {
      ensureAudio();
      stepIndex = 0;
      inSession = true;
      sessionResults = {};
      sessionCoact = {};
      resetRest();
      setPaused(false);
      buildDots();
      showScreen("session");
      enableCamera();
      requestWakeLock();
      if (settings.meter) {
        activitySource.load();
        activitySource.start(onMeterSample);
      }
      beginPhase("prep");
    }

    function stopSession() {
      clearInterval(timerId);
      inSession = false;
      stopSpeech();
      stopCamera();
      releaseWakeLock();
      activitySource.stop();
      els.meter.hidden = true;
    }

    function finishSession() {
      stopSession();
      sessionRestSummary = summarizeRest();
      recordSession(true);
      lastSessionTs = getHistory().at(-1)?.ts ?? null;
      buildDiary();
      sounds.finish();
      speak(t("announce.done"));
      announce(t("announce.done"));
      renderComplete();
      showScreen("complete");
    }

    function endSession() {
      stopSession();
      recordSession(false);
      goHome();
    }

    function goHome() {
      routine = buildRoutine(settings.length);
      renderIntro();
      showScreen("intro");
    }

    function skipPhase() {
      clearInterval(timerId);
      stopSpeech();
      setPaused(false);
      advance();
    }

    function prevPhase() {
      clearInterval(timerId);
      stopSpeech();
      setPaused(false);
      const elapsed = phaseDuration - timeLeft;
      if (phase === "active" && elapsed > 3) {
        beginPhase("prep"); // restart current exercise
      } else if (stepIndex > 0) {
        stepIndex -= 1;
        beginPhase("prep");
      } else {
        beginPhase("prep");
      }
    }

    /* ------------------------------------------------------------------ */
    /* Wiring                                                              */
    /* ------------------------------------------------------------------ */
    document.querySelectorAll(".lang-switch button").forEach((b) =>
      b.addEventListener("click", () => {
        settings.lang = b.dataset.lang;
        store.set("lang", settings.lang);
        applyLanguage();
      })
    );

    els.lengthPicker.querySelectorAll("button").forEach((b) =>
      b.addEventListener("click", () => {
        settings.length = b.dataset.length;
        store.set("length", settings.length);
        routine = buildRoutine(settings.length);
        renderIntro();
      })
    );

    els.soundToggle.addEventListener("change", () => {
      settings.sound = els.soundToggle.checked;
      store.set("sound", settings.sound);
    });

    els.synkinesisToggle.addEventListener("change", () => {
      settings.synkinesis = els.synkinesisToggle.checked;
      store.set("synkinesis", settings.synkinesis);
      routine = buildRoutine(settings.length);
      renderIntro();
    });

    els.meterToggle.addEventListener("change", () => {
      settings.meter = els.meterToggle.checked;
      store.set("meter", settings.meter);
      renderIntro();
    });

    els.sidePicker.querySelectorAll("button").forEach((b) =>
      b.addEventListener("click", () => {
        settings.side = b.dataset.side;
        store.set("side", settings.side);
        renderMeterLabels();
        renderIntro();
      })
    );

    els.voiceToggle.addEventListener("change", () => {
      settings.voice = els.voiceToggle.checked;
      store.set("voice", settings.voice);
      if (!settings.voice) stopSpeech();
    });

    els.shuffleBtn.addEventListener("click", () => {
      routine = buildRoutine(settings.length);
      renderIntro();
    });

    els.resetHistoryBtn.addEventListener("click", () => {
      if (confirm(t("history.confirm"))) {
        store.set("history", []);
        renderIntro();
      }
    });

    els.diary.addEventListener("submit", saveDiary);
    els.beginBtn.addEventListener("click", startSession);
    els.restartBtn.addEventListener("click", () => {
      routine = buildRoutine(settings.length);
      startSession();
    });
    els.homeBtn.addEventListener("click", goHome);
    els.pauseBtn.addEventListener("click", () => setPaused(!isPaused));
    els.skipBtn.addEventListener("click", skipPhase);
    els.prevBtn.addEventListener("click", prevPhase);
    els.endBtn.addEventListener("click", endSession);

    // Some browsers load speech voices asynchronously.
    if ("speechSynthesis" in window) speechSynthesis.getVoices();

    routine = buildRoutine(settings.length);
    applyLanguage();
  </script>
</body>

</html>
